services:
  api:
    env_file:
      - ./api/.env.dev

  queue-worker:
    env_file:
      - ./api/.env.dev

  scheduler:
    env_file:
      - ./api/.env.dev

  nginx:
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  client:
    env_file:
      - ./client/.env.dev

  scraper:
    env_file:
      - ./scraper/.env.dev