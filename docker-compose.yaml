services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./api/.env.prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - storage-data:/usr/share/nginx/html/storage
    networks:
      - verdko-network

  queue-worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: queue-worker
    restart: unless-stopped
    command: php artisan queue:work redis --queue=scout,default --sleep=1 --tries=3 --timeout=90 --max-time=3600
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      IS_WORKER: "true"
    env_file:
      - ./api/.env.prod
    healthcheck:
      test: ["CMD", "pgrep", "-f", "queue:work"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - storage-data:/usr/share/nginx/html/storage
    networks:
      - verdko-network

  scheduler:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    env_file:
      - ./api/.env.prod
    healthcheck:
      test: ["CMD", "pgrep", "-f", "schedule:work"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - storage-data:/usr/share/nginx/html/storage
    networks:
      - verdko-network

  nginx:
    image: nginx:1-bookworm
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - verdko-network
      
  db:
    image: postgres:18-bookworm
    container_name: db
    restart: always
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/18/docker
    environment:
      - POSTGRES_DB=${POSTGRESQL_DATABASE}
      - POSTGRES_USER=${POSTGRESQL_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRESQL_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRESQL_USERNAME} -d ${POSTGRESQL_DATABASE}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - verdko-network
      
  redis:
    image: redis:8-bookworm
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} --no-auth-warning ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - verdko-network

volumes:
  storage-data:
    driver: local
  db-data:
    driver: local
  redis-data:
    driver: local

networks:
  verdko-network:
    driver: bridge